# Copy this file to profiles.yaml (or point --config / BPT_CONFIG_PATH at your own copy)
# and fill in real values. Do not commit real proxy credentials.

# Path to your fingerprint-chromium binary. Can also be set via the BPT_BINARY_PATH env
# var (which takes priority over this field). This tool does not download or build the
# binary — get it from https://github.com/adryfish/fingerprint-chromium/releases
binaryPath: C:/tools/fingerprint-chromium/chrome.exe

profiles:
  - name: amazon-us
    # userDataDir: ./profiles/amazon-us     # auto-derived from name if omitted
    proxy:
      host: proxy.example.com
      port: 10000
      username: user123
      password: pass123
      scheme: http                          # http | socks5
    fingerprint:
      template: windows-chrome-1080p        # see src/fingerprints.js for the full list
      seed: "1234567890"                    # generated by `bpt profile add` — never hand-edit
    webrtcPolicy: proxy-only
    timezone: America/New_York
    locale: en-US
    deviceType: desktop                     # desktop | mobile
    headless: false

  - name: client-fb-uk
    proxy:
      host: proxy2.example.com
      port: 20000
      username: user456
      password: pass456
      scheme: socks5
    fingerprint:
      template: macos-chrome-1440p
      seed: "987654321"
    webrtcPolicy: proxy-only
    timezone: Europe/London
    locale: en-GB
    deviceType: desktop
    headless: false
